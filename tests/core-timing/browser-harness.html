<!doctype html><meta charset="utf-8"><title>Schema4 consumer boundary harness</title>
<style>body{background:#152932;color:#fff;font:16px system-ui;padding:12px}canvas{background:#294b58}pre{white-space:pre-wrap;overflow-wrap:anywhere}b{color:#ffc078}</style>
<h1>schema4 타이밍 검사</h1><p>검사용 도형입니다. 최종 캐릭터·공격 미술 검수가 아닙니다.</p><canvas width="340" height="300"></canvas><p id="label"></p><pre id="result"></pre>
<script type="module">
import {home,flightDuration} from '../../src/core-timing/timing.ts';
import * as core from '../../src/core-timing/index.ts';
import {createConsumer} from './consumer.ts';
function legal(seed=1){let r=core.createMatch(seed,core.EXPERIMENT_RULES_ID),s=r.state;for(const slot of seed===1?[0]:[0,2]){r=core.dispatch(s,{type:'recruit',offerSlot:slot});if(!r.ok)throw Error(r.error.code);s=r.state;const id=s.units.at(-1).id;r=core.dispatch(s,{type:'move',unitId:id,to:{kind:'board',col:slot===0?0:1,row:0}});if(!r.ok)throw Error(r.error.code);s=r.state;}r=core.dispatch(s,{type:'startWave'});if(!r.ok)throw Error(r.error.code);return r.state;}

const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),point=p=>({x:40+(p.x+500)*.05,y:40+(p.y+500)*.04});
function draw(o,view,size){ctx.clearRect(0,0,400,300);ctx.strokeStyle='#829b9d';ctx.strokeRect(40,40,250,200);ctx.fillStyle='#b8ddeb';ctx.fillRect(90-size/2,80-size/2,size,size);ctx.font='14px system-ui';ctx.fillText(size+'px',85,135);
for(const e of o.enemies){const p=point(e.position);ctx.fillStyle='#d8e3cb';ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.fill();ctx.fillText('#'+e.id+' HP '+e.hp,p.x-20,p.y-20);}
for(const f of view.flights){const p=point(f.position);ctx.fillStyle='#ffd6a0';ctx.fillRect(p.x-4,p.y-3,8,6);}
for(const a of view.aftermath.filter(a=>o.tick-a.tick<5))for(const h of a.hits){const p=point(h.position);ctx.strokeStyle='#ff857c';ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.stroke();}
document.querySelector('#label').textContent='tick '+o.tick+' · windup '+o.windups.length+' · flight '+o.flights.length+' · HP '+o.enemies.map(e=>e.hp).join(',');}
window.timingHarness={core,legal,home,flightDuration,async lateDecode(){const s5=core.advance(legal(),5).state,r6=core.advance(s5,1),o5=core.observe(s5),o6=core.observe(r6.state),owner={},c=createConsumer();c.bind(owner);const first=c.present(owner,o5,[],0);if(JSON.stringify(first.flights[0].position)!==JSON.stringify(o5.flights[0].position))throw Error('FIRST_REWIND');const pending=new Promise(resolve=>setTimeout(()=>resolve(c.present(owner,o5,[],0)),100));const impact=c.present(owner,o6,r6.events,0),late=await pending,latest=c.present(owner,o6,[],1);if(late!==null||latest.flights.length||latest.hp[0][1]!==10)throw Error('STALE_DECODE');return{first,impact,late,latest};},async run(batch,frameMs,size,seed=1){let s=legal(seed),owner={},c=createConsumer(),all=[],frames=[];c.bind(owner);while(s.tick<30&&s.phase==='combat'){await new Promise(r=>setTimeout(r,frameMs));const r=core.advance(s,Math.min(batch,30-s.tick));if(!r.ok)throw Error(r.error.code);s=r.state;all.push(...r.events);const o=core.observe(s);for(const alpha of [0,.5,1]){const v=c.present(owner,o,r.events,alpha);for(const a of r.events.filter(e=>e.type==='attackImpacted'))if(v.flights.some(f=>f.attackId===a.attackId))throw Error('PAST_FLIGHT');draw(o,v,size);}frames.push({wall:performance.now(),tick:s.tick,hp:o.enemies.map(e=>[e.id,e.hp]),pending:o.flights.map(f=>f.attackId),events:r.events});}const result={seed,batch,frameMs,size,hash:core.stateHash(s),canonical:core.canonicalState(s),events:all,frames};document.querySelector('#result').textContent=JSON.stringify({batch,frameMs,size,hash:result.hash},null,2);return result;},lifecycle(){const s=core.advance(legal(),4).state,hash=core.stateHash(s),owner={},next={},c=createConsumer();c.bind(owner);const pending=c.present(owner,core.observe(s),[],.5);for(let i=0;i<20;i++)c.present(owner,core.observe(s),[],1);if(core.stateHash(s)!==hash)throw Error('PAUSE_MUTATION');c.bind(next);if(c.present(owner,core.observe(s),[],0)!==null)throw Error('STALE_OWNER');const post=core.advance(s,2).state,late=c.present(next,core.observe(post),[],0);if(late.flights.length||late.aftermath.length)throw Error('LATE_REPLAY');return{pending,late,hash};}};
</script>
