<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포포 · 편지 도착 검수</title><body><main><p class="eyebrow">무한의 가챠 디펜스 / 별도 검수</p><h1>손끝에서, 적에게.</h1><p>포포 v6 후보 · fixture-01 · schema4 실제 전투</p><div class="controls"><button id="restart">처치 장면 재생</button><button id="hit">타격 장면 재생</button><button id="pause">일시 정지</button><label>몸 높이 <select id="size"><option>32</option><option selected>36</option></select>px</label><label>프레임 간격 <select id="delay"><option value="0">정상 RAF</option><option>150</option><option>250</option></select>ms</label></div><section><canvas width="360" height="260" aria-label="실제 공격 검수 화면"></canvas><p id="status" aria-live="polite"></p><button id="retry" hidden>이미지 다시 불러오기</button><div class="steps"><span>준비</span><span>방출</span><span>비행</span><span>접촉·피해</span></div><p id="ledger"></p></section><p class="note">오른쪽 방향 후보만 연결했습니다(수평축 ±31°). 왼쪽·상하·나머지 대각 자세는 미지원입니다. 캐릭터 반전은 사용하지 않습니다. 원화의 회복 자세 머리·발 흔들림은 아직 승인되지 않았습니다.</p><p class="note">정상 속도: 코어 1 tick = 50ms. 준비 150ms → 비행 100ms. 늦은 프레임에서는 이미 끝난 비행을 재연하지 않습니다. 배경 적은 실제 관측 위치에 표시됩니다.</p></main><script type="module" src="/src/web/popo-timing/main.ts"></script></body></html>
