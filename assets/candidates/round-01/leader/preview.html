</style><h1>리더 후보 · 검토용</h1><p>PNG 원본은 변경하지 않습니다. 수정 원본의 바이트 수·해시·PNG 전체 디코딩을 확인했습니다. 후보 비교이며 제작용 승인은 별도입니다.</p><p id="status" class="status">이미지 검사 중</p><button id="scale">캔버스 기준 / 실루엣 약80% 비교</button><section><h2>864 × 864 · 타일144</h2><div id="board-864" class="board" style="--size:864px"></div></section><section><h2>360 × 360 · 타일60</h2><div id="board-360" class="board" style="--size:360px"></div></section><script>

ath","file":"mint-straight-path.png","rotation_degrees_clockwise":0},{"row":3,"col":0,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":0},{"row":3,"col":1,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":3,"col":2,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":3,"col":3,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":3,"col":4,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":3,"col":5,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":0},{"row":4,"col":0,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":0},{"row":4,"col":1,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":4,"col":2,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":4,"col":3,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":4,"col":4,"role":"deployment","file":"cream-deployment.png","rotation_degrees_clockwise":0},{"row":4,"col":5,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":0},{"row":5,"col":0,"role":"path","file":"mint-corner-path-v2.png","rotation_degrees_clockwise":0},{"row":5,"col":1,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":90},{"row":5,"col":2,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":90},{"row":5,"col":3,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":90},{"row":5,"col":4,"role":"path","file":"mint-straight-path.png","rotation_degrees_clockwise":90},{"row":5,"col":5,"role":"path","file":"mint-corner-path-v2.png","rotation_degrees_clockwise":270}],"units":[{"row":1,"col":1,"file":"capsule-guardian.png","pivot_normalized":[0.5,0.9433811802232854],"tile_anchor_normalized":[0.5,0.875],"rotation_degrees_clockwise":0},{"row":1,"col":4,"file":"capsule-guardian.png","pivot_normalized":[0.5,0.9433811802232854],"tile_anchor_normalized":[0.5,0.875],"rotation_degrees_clockwise":0},{"row":4,"col":1,"file":"capsule-guardian.png","pivot_normalized":[0.5,0.9433811802232854],"tile_anchor_normalized":[0.5,0.875],"rotation_degrees_clockwise":0},{"row":4,"col":4,"file":"capsule-guardian.png","pivot_normalized":[0.5,0.9433811802232854],"tile_anchor_normalized":[0.5,0.875],"rotation_degrees_clockwise":0}],"assembly_constraints":["Use unchanged source PNG files as image elements; no generated complete-board replacement and no raster pixel editing.","Floor image width and height both equal tile size, display block; no object-fit crop, per-cell margins, or rounded masks.","Rotation, layout scaling, and compositing are display transforms only. Do not overwrite sources.","Unit pivot aligns with each tile's (0.5,0.875) local anchor. Distinguish image canvas dimensions from visible silhouette.","For a comparison of bevel-lighting effects, optionally display a second board with all floor assets at 0deg; this is a QA variant, not a direction-accurate corner layout.","No UI labels, arrows, numbers, stars or plus signs overlaid in the board specimen.","Store a screenshot of each actual browser composition and report viewport/render scale. Inspect whether repeated texture is distracting, at both 144px and60px tile sizes."],"known_qa_risks":["Subtle directional bevel lighting rotates with image transforms.","Thin corner seam endpoints approximately match adjacent centerlines; should be inspected at target scale.","Unit alpha noise outside substantial bounds is retained and may need later authorized imagegen correction.","Actual assembled board remains the next verification step; this spec does not claim it was rendered."]};
let silhouette=false;
function render(){for(const variant of layout.variants){const board=document.getElementById(variant.id);board.replaceChildren();const tile=variant.tile_px;
for(const cell of layout.cells){const img=new Image();img.className='floor';img.src=cell.file;img.alt=cell.role;img.style.transform='rotate('+cell.rotation_degrees_clockwise+'deg)';board.append(img);}
for(const unit of layout.units){const img=new Image();img.className='guardian';img.src=unit.file;img.alt='capsule guardian';const width=silhouette?tile*0.8*1254/1028:variant.unit_canvas_px;img.style.width=width+'px';img.style.height=width+'px';img.style.left=((unit.col+0.5)*tile-width*0.5)+'px';img.style.top=((unit.row+0.875)*tile-width*(1183/1254))+'px';board.append(img);}}
window.previewReady=Promise.all([...new Set(layout.cells.map(c=>c.file).concat(layout.units.map(u=>u.file)))].map(async file=>{const img=new Image();img.src=file;try{await img.decode();return {file,decoded:true,width:img.naturalWidth,height:img.naturalHeight}}catch(e){return {file,decoded:false,error:String(e)}}})).then(results=>{window.decodeResults=results;document.getElementById('status').textContent=results.every(r=>r.decoded)?'Browser decode succeeded. Full PNG integrity and peer visual review still required.':'BLOCKED: '+results.filter(r=>!r.decoded).map(r=>r.file).join(', ');return results;});}
